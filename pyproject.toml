[project]
name = "abogen"
description = "Generate audiobooks from EPUBs, PDFs and text with synchronized captions."
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = "MIT"
authors = [{ name = "Deniz Şafak", email = "denizsafak98@gmail.com" }]
keywords = [
  "accessibility",
  "audiobook",
  "book-converter",
  "chapter-management",
  "content-creation",
  "epub",
  "kokoro",
  "media-generation",
  "multilingual",
  "pdf",
  "subtitle",
  "subtitles",
  "text-to-speech",
  "tts",
  "voice-synthesis",
]
dependencies = [
  "Flask>=3.1.0",
  "Markdown>=3.9",
  "PyMuPDF>=1.25.5",
  "PyQt6>=6.5.0",
  "beautifulsoup4>=4.13.4",
  "chardet>=5.2.0",
  "charset_normalizer>=3.4.1",
  "ebooklib>=0.19",
  "gpustat>=1.1.1",
  "httpx>=0.27.0",
  "kokoro>=0.9.4",
  "misaki[en]>=0.9.4",
  "mutagen>=1.47.0",
  "num2words>=0.5.13",
  "numpy>=1.24.0",
  "pip",
  "platformdirs>=4.3.7",
  "pygame>=2.6.1",
  "python-dotenv>=1.0.1",
  "soundfile>=0.13.1",
  "spacy>=3.8.7,<4.0",
  "static_ffmpeg>=2.13",
  "supertonic>=0.1.0",
]

classifiers = [
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing",
]

dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/denizsafak/abogen"
Homepage = "https://github.com/denizsafak/abogen"
Issues = "https://github.com/denizsafak/abogen/issues"
Repository = "https://github.com/denizsafak/abogen"

[project.scripts]
# Run after every `uv tool install` or `uv pip install` to re-apply patches
abogen-apply-patches = "abogen.scripts.apply_patches:main"
abogen-cli = "abogen.webui.app:main"
abogen-pyqt = "abogen.pyqt.main:main"
abogen-web = "abogen.webui.app:main"

[project.gui-scripts]
abogen = "abogen.pyqt.main:main"

# --- OPTIONAL DEPENDENCIES ---

[project.optional-dependencies]
# NVIDIA GPU (Windows) (CUDA 12.8)       # uv tool install abogen[cuda]
cuda = ["torch; sys_platform == 'win32'"]
# NVIDIA GPU (Windows) (CUDA 12.6)       # uv tool install abogen[cuda126]
cuda126 = ["torch; sys_platform == 'win32'"]
# NVIDIA GPU (Windows) (CUDA 13.0)       # uv tool install abogen[cuda130]
cuda130 = ["torch; sys_platform == 'win32'"]
# Development dependencies               # uv tool install abogen[dev]
dev = ["build", "pyright>=1.1.411", "pytest", "ruff>=0.16.5", "ty>=0.0.76"]
# Apple Silicon acceleration via MLX       # uv tool install abogen[mlx]
mlx = ["mlx-audio>=0.5.2; sys_platform == 'darwin'"]
# AMD GPU (Linux) (ROCm 6.4)             # uv tool install abogen[rocm]
rocm = ["torch; sys_platform == 'linux'", "pytorch-triton-rocm; sys_platform == 'linux'"]

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.16.5",
  "ty>=0.0.76",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/demo",
  "/abogen/resources",
  "/abogen/assets/create_shortcuts.bat",
  "WINDOWS_INSTALL.bat",
]

[tool.hatch.build.targets.wheel]
packages = ["abogen"]

[tool.hatch.version]
path = "abogen/VERSION"
pattern = "^(?P<version>.+)$"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest]
filterwarnings = [
  "ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning",
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "LOG015",  # Root logger calls (used throughout desktop GUI)
  "S110",  # try-except-pass (used in fallback extractors)
  "S112",  # try-except-continue (used in fallback extractors)
  "DTZ005",  # datetime.now() without tz (local timestamps for filenames)
  "DTZ006",  # datetime.fromtimestamp() without tz
  "SIM115",  # open() without with (long-lived worker stream file handles)
  "SIM102",  # collapsible-if (nested ifs with separate comments)
  "B023",  # loop variable binding in synchronous inner helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "B009", "B010", "S101"]
"abogen/pyqt/**" = ["BLE001"]
"abogen/webui/**" = ["BLE001"]
"abogen/predownload_gui.py" = ["BLE001"]
"abogen/book_parser.py" = ["BLE001"]
"abogen/text_extractor.py" = ["BLE001"]
"build_pypi.py" = ["EXE001", "BLE001"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

# --- KOKORO CONFIGURATION (for macOS) ---
[tool.uv.exclude-newer-package]
mlx-audio = "2026-09-08T00:00:00Z"

[tool.uv.sources]
kokoro = [
  { git = "https://github.com/hexgrad/kokoro.git", marker = "sys_platform == 'darwin'" },
  { index = "pypi", marker = "sys_platform != 'darwin'" },
]

# --- TORCH CONFIGURATION ---
# Keep source routing minimal here for lock stability.
# Mixing CUDA/ROCm source markers in a single universal lock has produced
# cross-environment resolution conflicts in uv; macOS arm64 stays explicit.

torch = [
  # macOS (Apple Silicon)
  { index = "pytorch", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" }
]

# --- TRITON CONFIGURATION ---

pytorch-triton-rocm = [
  { index = "pytorch-rocm-64-nightly", marker = "extra == 'rocm'" },
]

# --- INDEX DEFINITIONS ---

# PyPI Index
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# PyTorch Index (macOS Apple Silicon)
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl"
explicit = true

# CUDA 12.6 Index
[[tool.uv.index]]
name = "pytorch-cuda-126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# CUDA 12.8 Index
[[tool.uv.index]]
name = "pytorch-cuda-128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# CUDA 13.0 Index
[[tool.uv.index]]
name = "pytorch-cuda-130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# ROCm 6.4 Nightly Index
[[tool.uv.index]]
name = "pytorch-rocm-64-nightly"
url = "https://download.pytorch.org/whl/nightly/rocm6.4"
explicit = true
